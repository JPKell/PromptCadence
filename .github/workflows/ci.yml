name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff format --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: mypy src tests

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: lint-imports

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - run: pytest -m "not live and not performance" --cov --cov-report=xml

  tests-314-early-warning:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -e ".[dev]"
      - run: pytest -m "not live and not performance"

  db-matrix:
    name: tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Credentials and database name match `weightsdb.testing`'s documented default URL, so the
        # service this job starts is the one the package looks for. The scaffold named a
        # `postgres`/`postgres` server nothing ever connected to, and passed it as `DATABASE_URL`
        # — a variable `temporary_postgres` does not read. Under REQUIRE_POSTGRES=1 that is a hard
        # failure rather than a skip, so this job would have been red on the first push while
        # appearing to test PostgreSQL. LoadCoach, IdeaPress, LoadLedger and WeightsDB all fixed
        # the same defect in their own jobs; this is that fix.
        env:
          POSTGRES_USER: weightsdb
          POSTGRES_PASSWORD: weightsdb
          POSTGRES_DB: weightsdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weightsdb -d weightsdb_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,postgres]"
      # Selected by path, as every sibling does. The `integration` marker stays registered and
      # applied — it is what `-m integration` selects locally — but the job must not depend on a
      # marker to find its tests: selecting on one a repository forgets to apply collects zero and
      # exits 5, which is the failure this selection cannot have.
      - run: pytest -m "not live and not performance" tests/integration
        env:
          # Without this the PostgreSQL legs would skip exactly as they do on a developer's
          # machine, and the job would go green having tested SQLite twice.
          WEIGHTSDB_REQUIRE_POSTGRES: "1"
          # `temporary_postgres` reads WEIGHTSDB_POSTGRES_URL, not DATABASE_URL. Set explicitly
          # rather than relying on the default, so the job states which server it is testing.
          WEIGHTSDB_POSTGRES_URL: postgresql+psycopg://weightsdb:weightsdb@localhost:5432/weightsdb_test

  coverage:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -m "not live and not performance" --cov --cov-report=term-missing --cov-fail-under=85

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -m contract

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # gitleaks scans *history*, and `actions/checkout` fetches a single commit by default.
        # For a push it is handed `<first-pushed>^..<last-pushed>`, so the parent of the first
        # pushed commit has to be in the object store; in a depth-1 clone it is not, and git
        # answers "unknown revision", which the action reports as exit code 1.
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - run: pip-audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  install-check:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - run: pip install dist/*.whl
      - run: python -c "import promptcadence"
