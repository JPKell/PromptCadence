name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff format --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  # Every job below installs from the hash-pinned lock and then the package itself with
  # `--no-deps` (Packaging Standards §4): what CI tests is what `requirements/ci.lock` resolved,
  # not today's resolution, and the package is installed non-editably so coverage and imports
  # measure the installed distribution. The 3.14 early-warning job is the one deliberate
  # exception — see its comment.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: mypy src tests

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: lint-imports

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest -m "not live and not performance" --cov --cov-report=xml

  tests-314-early-warning:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      # Deliberately unpinned: ci.lock is resolved on 3.13, and pinning a version that has no
      # 3.14 wheels would defeat the purpose of an early warning.
      - run: pip install -e ".[dev]"
      - run: pytest -m "not live and not performance"

  db-matrix:
    name: tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Credentials and database name match `weightsdb.testing`'s documented default URL, so the
        # service this job starts is the one the package looks for. The scaffold named a
        # `postgres`/`postgres` server nothing ever connected to, and passed it as `DATABASE_URL`
        # — a variable `temporary_postgres` does not read. Under REQUIRE_POSTGRES=1 that is a hard
        # failure rather than a skip, so this job would have been red on the first push while
        # appearing to test PostgreSQL. LoadCoach, IdeaPress, LoadLedger and WeightsDB all fixed
        # the same defect in their own jobs; this is that fix.
        env:
          POSTGRES_USER: weightsdb
          POSTGRES_PASSWORD: weightsdb
          POSTGRES_DB: weightsdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weightsdb -d weightsdb_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      # Selected by path, as every sibling does. The `integration` marker stays registered and
      # applied — it is what `-m integration` selects locally — but the job must not depend on a
      # marker to find its tests: selecting on one a repository forgets to apply collects zero and
      # exits 5, which is the failure this selection cannot have.
      - run: pytest -m "not live and not performance" tests/integration
        env:
          # Without this the PostgreSQL legs would skip exactly as they do on a developer's
          # machine, and the job would go green having tested SQLite twice.
          WEIGHTSDB_REQUIRE_POSTGRES: "1"
          # `temporary_postgres` reads WEIGHTSDB_POSTGRES_URL, not DATABASE_URL. Set explicitly
          # rather than relying on the default, so the job states which server it is testing.
          WEIGHTSDB_POSTGRES_URL: postgresql+psycopg://weightsdb:weightsdb@localhost:5432/weightsdb_test

  coverage:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest -m "not live and not performance" --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      # diff-cover is not part of the hash-pinned application dependency set, so it is
      # installed the same way ruff and pip-audit are elsewhere in this file: unpinned, for a
      # standalone CI tool rather than something the package depends on.
      - run: pip install diff-cover
      # Testing standards §10: the repository-wide floor says nothing about whether *this*
      # change was tested, so diff-cover checks coverage of only the lines this ref changed,
      # against origin/main (pull requests) or the previous commit (pushes to main).
      - name: diff-cover
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff-cover coverage.xml --compare-branch=origin/main --fail-under=90
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            diff-cover coverage.xml --compare-branch=HEAD~1 --fail-under=90
          else
            echo "No previous commit to diff against (first commit on main); skipping diff-cover."
          fi

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest -m contract

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # gitleaks scans *history*, and `actions/checkout` fetches a single commit by default.
        # For a push it is handed `<first-pushed>^..<last-pushed>`, so the parent of the first
        # pushed commit has to be in the object store; in a depth-1 clone it is not, and git
        # answers "unknown revision", which the action reports as exit code 1.
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      # Audit the locked sets, not the job's own environment: a bare `pip-audit` here would
      # inspect an environment containing only pip-audit itself (Security Standards §11).
      - run: pip-audit --require-hashes -r requirements/ci.lock
      - run: pip-audit --require-hashes -r requirements/release.lock
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The pinned build chain, byte-for-byte what `release.yml` uses, so a release is the
      # artifact CI proved rather than a fresh resolution of `build` and `hatchling`.
      - run: pip install --require-hashes -r requirements/release.lock
      - run: python -m build --no-isolation
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  install-check:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - run: pip install dist/*.whl
      - run: python -c "import promptcadence"
      - run: promptcadence --version
      - run: python -m promptcadence --version
      # Packaging standards §10: the optional postgres extra must resolve and install
      # cleanly from the built wheel too, not only from an editable source checkout.
      - run: pip install "$(ls dist/*.whl)[postgres]"
      - run: pipx install dist/*.whl && promptcadence --version
