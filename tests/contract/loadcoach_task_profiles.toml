# LoadCoach — shipped task profiles (routing.md §2).
#
# Twenty profiles, as named in routing.md §2: general.chat, general.reasoning,
# general.summarize, code.generate, code.review, code.debug, content.research_synthesis,
# content.outline, content.article_draft, content.rewrite, content.edit, content.review,
# content.fact_check, structured.extract, tools.agent, and PromptCadence's five harness profiles
# tools.agent.local_fast, tools.agent.local_large, tools.agent.remote_cheap,
# tools.agent.remote_frontier, tools.plan.
#
# A task profile is routing intent, not a prompt (routing.md §2). Weights must sum to 1.0 and are
# soft (they rank); constraints are hard (they filter). Every capability named — in weights,
# requires_capabilities or min_capability_scores — must be in the SetSpec capability vocabulary.

[task_profiles."general.chat"]
version = "1.0.0"
description = "Open-ended conversational response."

[task_profiles."general.chat".weights]
reasoning = 0.30
instruction_following = 0.30
creative_writing = 0.20
reliability = 0.20

[task_profiles."general.chat".constraints]
min_context_tokens = 4096
max_latency_p95_seconds = 30
allow_remote_providers = false

[task_profiles."general.chat".execution]
temperature = 0.7
max_output_tokens = 2048
response_format = "text"
max_attempts = 2
fallback_depth = 1

[task_profiles."general.chat".validation]
max_output_chars = 50000

