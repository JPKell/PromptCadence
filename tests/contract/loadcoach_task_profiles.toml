# --- PromptCadence's harness profiles (ADR-0047 §1, routing.md §2) --------------------------------
#
# Five namespaced specializations of `tools.agent`, shipped here because a PromptCadence tier is
# configuration over exactly one LoadCoach task profile and PromptCadence performs no routing maths.
# LoadCoach has no vocabulary for model size, so what separates `local_fast` from `local_large` is
# the latency ceiling, the minimum served context and the minimum capability scores — that is the
# decision, not an approximation of one. Each profile's `min_context_tokens` equals its tier's
# `context_budget_tokens`, so a tier that cannot be served its own compaction budget is rejected by
# `context_too_small` rather than admitted and silently truncated.

[task_profiles."tools.agent.local_fast"]
version = "1.0.0"
description = "Agent turns on a small local model: tools, short latency, a 16k context budget."

[task_profiles."tools.agent.local_fast".weights]
agentic = 0.35
tool_use = 0.30
reasoning = 0.20
reliability = 0.15

[task_profiles."tools.agent.local_fast".constraints]
min_context_tokens = 16384
requires_capabilities = ["tool_use"]
max_latency_p95_seconds = 60
min_capability_scores = { tool_use = 0.3 }
allow_remote_providers = false

[task_profiles."tools.agent.local_fast".execution]
temperature = 0.2
max_output_tokens = 4096
response_format = "text"
max_attempts = 3
fallback_depth = 2

[task_profiles."tools.agent.local_fast".validation]
max_output_chars = 100000

