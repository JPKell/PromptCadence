# `tools.plan` deliberately declares no schema: the plan document's shape stays PromptCadence's,
# which validates it against its own model. What LoadCoach enforces is that the answer is JSON.
[task_profiles."tools.plan"]
version = "1.0.0"
description = "Draft a structured multi-step plan as JSON, for a harness to validate and approve."

[task_profiles."tools.plan".weights]
reasoning = 0.40
structured_output = 0.30
instruction_following = 0.20
reliability = 0.10

[task_profiles."tools.plan".constraints]
min_context_tokens = 16384
requires_capabilities = ["structured_output"]
max_latency_p95_seconds = 180
min_capability_scores = { structured_output = 0.4 }
allow_remote_providers = false

[task_profiles."tools.plan".execution]
temperature = 0.1
max_output_tokens = 4096
response_format = "json"
max_attempts = 3
